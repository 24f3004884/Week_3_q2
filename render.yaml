services:
  - type: web
    name: a2a-invoice-agent
    runtime: docker
    plan: free
    healthCheckPath: /.well-known/agent-card.json
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite